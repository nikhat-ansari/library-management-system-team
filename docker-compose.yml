name: library-management-system

x-lms-service: &lms-service
  restart: unless-stopped
  environment:
    NODE_ENV: production
    MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/lms-users}
  networks:
    - lms

services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - '${MONGODB_PORT:-27017}:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lms

  api-gateway:
    <<: *lms-service
    build:
      context: .
      dockerfile: apps/backend/api-gateway/Dockerfile
    ports:
      - '${API_GATEWAY_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      SERVICE_NAME: api-gateway
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/lms-users}
      AUTH_SERVICE_URL: http://auth-service:3001

  auth-service:
    <<: *lms-service
    build: { context: ., dockerfile: apps/backend/auth-service/Dockerfile }
    environment:
      NODE_ENV: production
      PORT: 3001
      SERVICE_NAME: auth-service
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/lms-users}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      USER_SERVICE_URL: http://user-service:3002
