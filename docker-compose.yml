name: library-management-system

x-lms-service: &lms-service
  restart: unless-stopped
  env_file:
    - .env
  environment:
    NODE_ENV: production
  networks:
    - lms

services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - '${MONGODB_PORT:-27017}:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lms

  api-gateway:
    <<: *lms-service
    build:
      context: .
      dockerfile: apps/backend/api-gateway/Dockerfile
    ports:
      - '${API_GATEWAY_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      SERVICE_NAME: api-gateway
      AUTH_SERVICE_URL: http://auth-service:3001

  auth-service:
    <<: *lms-service
    build: { context: ., dockerfile: apps/backend/auth-service/Dockerfile }
    environment:
      NODE_ENV: production
      PORT: 3001
      SERVICE_NAME: auth-service
      USER_SERVICE_URL: http://user-service:3002

  user-service:
    <<: *lms-service
    build: { context: ., dockerfile: apps/backend/user-service/Dockerfile }
    environment: { NODE_ENV: production, PORT: 3002, SERVICE_NAME: user-service }
  catalog-service:
    <<: *lms-service
    build: { context: ., dockerfile: apps/backend/catalog-service/Dockerfile }
    environment: { NODE_ENV: production, PORT: 3003, SERVICE_NAME: catalog-service }
  circulation-service:
    <<: *lms-service
    build: { context: ., dockerfile: apps/backend/circulation-service/Dockerfile }
    environment: { NODE_ENV: production, PORT: 3004, SERVICE_NAME: circulation-service }
  reservation-service:
    <<: *lms-service
    build: { context: ., dockerfile: apps/backend/reservation-service/Dockerfile }
    environment: { NODE_ENV: production, PORT: 3005, SERVICE_NAME: reservation-service }
  fine-service:
    <<: *lms-service
    build: { context: ., dockerfile: apps/backend/fine-service/Dockerfile }
    environment: { NODE_ENV: production, PORT: 3006, SERVICE_NAME: fine-service }
  seat-service:
    <<: *lms-service
    build: { context: ., dockerfile: apps/backend/seat-service/Dockerfile }
    environment: { NODE_ENV: production, PORT: 3007, SERVICE_NAME: seat-service }
  notification-service:
    <<: *lms-service
    build: { context: ., dockerfile: apps/backend/notification-service/Dockerfile }
    environment: { NODE_ENV: production, PORT: 3008, SERVICE_NAME: notification-service }
  report-service:
    <<: *lms-service
    build: { context: ., dockerfile: apps/backend/report-service/Dockerfile }
    environment: { NODE_ENV: production, PORT: 3009, SERVICE_NAME: report-service }
  audit-service:
    <<: *lms-service
    build: { context: ., dockerfile: apps/backend/audit-service/Dockerfile }
    environment: { NODE_ENV: production, PORT: 3010, SERVICE_NAME: audit-service }
  ai-service:
    <<: *lms-service
    build: { context: ., dockerfile: apps/backend/ai-service/Dockerfile }
    environment: { NODE_ENV: production, PORT: 3011, SERVICE_NAME: ai-service }
  scheduler-service:
    <<: *lms-service
    build: { context: ., dockerfile: apps/backend/scheduler-service/Dockerfile }
    environment: { NODE_ENV: production, PORT: 3012, SERVICE_NAME: scheduler-service }

volumes:
  mongo_data:

networks:
  lms:
